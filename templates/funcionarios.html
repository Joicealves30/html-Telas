<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Funcionários</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">

      
        <header class="header">
            <span class="icon"> 
                <img src="../img/carteira-de-identidade.png" alt="Ícone de Funcionários" width="50" height="50">
            </span>
            <div>
                <h1>Gerenciamento de Funcionários</h1>
                
            </div>
        </header>

        <section class="form-section">
            <h2>Adicionar Novo Funcionário</h2>

            <form id="cadastro-funcionario">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cargo">Cargo:</label>
                <input type="text" id="cargo" name="cargo" required>

                <label for="cultura">Cultura que atua:</label>
                <select id="cultura" name="cultura" required>
                    <option value="">Selecione</option>
                    <option value="Soja">Soja</option>
                    <option value="Milho">Milho</option>
                    <option value="Algodão">Café</option>
                </select>

                <label for="salario">Salário (R$):</label>
                <input type="number" id="salario" name="salario" required>

                <label for="atribuicoes">Atribuições:</label>
                <textarea id="atribuicoes" name="atribuicoes" rows="3" required></textarea>

                <input type="submit" value="Adicionar Funcionário" class="submit-btn">
            </form>
        </section>

        <main class="main-content">
            <div class="search-bar">
                <input type="text" id="busca" placeholder="Buscar por nome, cargo ou cultura...">
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Cultura</th>
                            <th>Carga Horária</th>
                            <th>Salário</th>
                            <th>Atribuições</th>
                            <th>Data Cadastro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-funcionarios">
                        
                    </tbody>
                </table>
            </div>
        </main>
    </div>

   <script src="../static/JavaScript.js"></script>

</body>
</html>
